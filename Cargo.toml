[workspace]
members = ["simplefin", "simplefin-cli", "simplefin-app"]
resolver = "3"

# Ely's upstream Cargo.toml pulls GPUI's desktop platform crate on every target, which
# has no Android/iOS backend. Until that fix is accepted upstream, build Ely from the
# fork branch that carries it (see simplefin-app/README.md); delete this patch then.
[patch."https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components"]
ely-gpui-component = { git = "https://github.com/csells/Ely-GPUI-Components", branch = "mobile-targets" }

# The browser build: small over fast (the wasm downloads to a phone).
[profile.web]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"

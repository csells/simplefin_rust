[package]
name = "simplefin-app"
version = "0.1.0"
edition = "2024"
description = "Multi-platform personal finance app on SimpleFIN, built with GPUI and Ely"
repository = "https://github.com/csells/simplefin_rust"
publish = false

[lib]
name = "simplefin_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "simplefin-app"
path = "src/main.rs"

[dependencies]
simplefin = { path = "../simplefin" }
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
# Ely embeds icons and fonts with rust-embed, which in debug builds reads them from
# the build machine's disk; a phone has no such path, so always embed.
rust-embed = { version = "8.12", features = ["debug-embed"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"
anyhow = "1"
# Wall-clock time that also works in browsers (std::time panics on wasm32).
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
env_logger = "0.11"
dirs = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.8" }
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# url_launcher: gpui-mobile's Platform::open_url is still a stub on Android.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "f9fe5a7", default-features = false, features = ["url_launcher"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

[dev-dependencies]
tempfile = "3"
